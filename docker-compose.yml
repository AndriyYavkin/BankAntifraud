name: bank-antifraud

x-rabbit-env: &rabbit-env
  RABBIT_HOST: rabbitmq
  RABBIT_VHOST: bank

x-jwt-env: &jwt-env
  JWT_SECRET: bank-antifraud-study-secret-key-at-least-32-bytes-long
  JWT_ISSUER: bank-auth

x-otel-env: &otel-env
  OTLP_ENDPOINT: http://tempo:4318/v1/traces

x-log-labels: &log-labels
  logging: alloy

services:
  postgres:
    image: postgres:16-alpine
    labels: *log-labels
    command:
      - postgres
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - log_min_duration_statement=1000
      - -c
      - max_connections=200
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank_admin
      POSTGRES_PASSWORD: bank_admin_pass
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_admin -d bank"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.0-management
    labels: *log-labels
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/bank.conf:/etc/rabbitmq/conf.d/20-bank.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    labels: *log-labels
    environment:
      <<: [*jwt-env, *otel-env]
      AUTH_DB_PATH: /data/users.db
      TOKEN_LIFETIME_MINUTES: "120"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin_pass_123
      OPERATOR_USERNAME: operator
      OPERATOR_PASSWORD: operator_pass
      ANALYST_USERNAME: analyst
      ANALYST_PASSWORD: analyst_pass
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - auth_data:/data
    restart: unless-stopped

  transfer-service:
    build: ./services/transfer-service
    labels: *log-labels
    environment:
      <<: [*rabbit-env, *jwt-env, *otel-env]
      RABBIT_USER: transfer_service
      RABBIT_PASS: transfer_pass
      DATABASE_URL: Host=postgres;Port=5432;Database=bank;Username=transfer_service;Password=transfer_db_pass;Maximum Pool Size=50
      ISOLATION_LEVEL: read-committed
      LOCK_MODE: ordered
      LOCK_HOLD_MS: "0"
      MAX_RETRIES: "0"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  fraud-worker:
    build: ./services/fraud-worker
    labels: *log-labels
    environment:
      <<: [*rabbit-env, *otel-env]
      RABBIT_USER: fraud_worker
      RABBIT_PASS: fraud_pass
      RABBIT_QUEUE: transfers.fraud-check
      DATABASE_URL: Host=postgres;Port=5432;Database=bank;Username=fraud_worker;Password=fraud_db_pass;Maximum Pool Size=10
      ANALYSIS_DELAY_MS: "0"
      HIGH_AMOUNT_THRESHOLD: "50000"
      VELOCITY_WINDOW_SECONDS: "60"
      VELOCITY_MAX_TRANSFERS: "5"
      PING_PONG_WINDOW_SECONDS: "300"
      FAN_OUT_WINDOW_SECONDS: "300"
      FAN_OUT_MAX_RECIPIENTS: "4"
      DRAIN_RATIO: "0.9"
      SUSPICIOUS_SCORE: "50"
      BLOCK_SCORE: "80"
      SWEEP_INTERVAL_SECONDS: "15"
      SWEEP_AGE_SECONDS: "60"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  load-generator:
    build: ./services/load-generator
    profiles: ["tools"]
    environment:
      AUTH_URL: http://auth-service:8002
      API_URL: http://transfer-service:8000
    depends_on:
      - auth-service
      - transfer-service

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://monitoring:monitoring_pass@postgres:5432/bank?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    user: "0"
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.0
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: bank_grafana
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bank-antifraud.json
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  auth_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  grafana_data:
